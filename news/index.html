<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家族の健康を守るメール講座｜成竹鍼灸整骨院グループ</title>
  <meta name="robots" content="noindex">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 16px;
      font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f5f6f8; color: #1e2430;
      display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;
    }
    .card {
      background: #fff; border-radius: 14px; padding: 32px 24px;
      max-width: 460px; width: 100%; margin-top: 8vh;
      box-shadow: 0 6px 24px rgba(20, 30, 60, .08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    .lead { font-size: .92rem; color: #5a6472; margin: 0 0 24px; line-height: 1.7; }
    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 6px; }
    input[type="email"] {
      width: 100%; padding: 12px 14px; font-size: 1rem;
      border: 1px solid #ccd3dd; border-radius: 8px; margin-bottom: 16px;
    }
    input[type="email"]:focus { outline: 2px solid #04137D; border-color: #04137D; }
    .cf-turnstile { margin-bottom: 16px; }
    button {
      width: 100%; padding: 14px; font-size: 1rem; font-weight: 700;
      color: #fff; background: #04137D; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #rondo-status { font-size: .9rem; line-height: 1.7; margin: 14px 0 0; min-height: 1.4em; }
    .note { font-size: .78rem; color: #8a93a2; margin-top: 20px; line-height: 1.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>家族の健康を守るメール講座</h1>
    <p class="lead">ご家族の「なんとなく不調」に早めに気づくコツを、3日に1通・全7通でお届けします。成竹鍼灸整骨院グループ（南砂・東砂・塩浜）代表の竹中浩が書いています。登録すると確認メールが届き、リンクを押すと1通目がすぐ届きます。</p>
    <form id="rondo-subscribe">
      <label for="rondo-email">メールアドレス</label>
      <input
        id="rondo-email"
        name="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        spellcheck="false"
        placeholder="you@example.com"
        required
      >
      <div class="cf-turnstile" data-sitekey="0x4AAAAAAESMH6mbmnjgDq27"></div>
      <div aria-hidden="true" style="position:absolute;left:-10000px">
        <label for="rondo-website">Website</label>
        <input id="rondo-website" name="website" type="text" tabindex="-1" autocomplete="off">
      </div>
      <button type="submit">登録確認メールを受け取る</button>
      <p id="rondo-status" role="status" aria-live="polite"></p>
    </form>
    <p class="note">配信はいつでもメール内のリンクから解除できます。発行者: 成竹グループ 竹中浩</p>
  </div>

  <script>
    (() => {
      const form = document.getElementById('rondo-subscribe');
      const status = document.getElementById('rondo-status');
      const button = form.querySelector('button[type="submit"]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const cfToken = data.get('cf-turnstile-response');
        if (!cfToken) {
          status.textContent = 'bot確認を完了してから、もう一度お試しください。';
          return;
        }
        button.disabled = true;
        button.textContent = '送信中…';
        status.textContent = '';
        try {
          const response = await fetch('https://rondo.takenakahiroshi.workers.dev/api/subscribe', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              email: data.get('email'),
              website: data.get('website'),
              cfToken,
              source: 'web',
            }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          form.reset();
          status.textContent = '確認メールを送りました。受信箱のリンクを開いて登録を完了してください。';
        } catch {
          status.textContent = '送信できませんでした。通信状態を確認し、bot確認をやり直してください。';
          if (window.turnstile) window.turnstile.reset();
        } finally {
          button.disabled = false;
          button.textContent = '登録確認メールを受け取る';
        }
      });
    })();
  </script>
</body>
</html>
